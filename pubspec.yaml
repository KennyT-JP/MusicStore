name: music_list_app
description: "音源創庫（Track Cabinet） — メンバーが録音した音源や YouTube 等の URL を持ち寄って共有するアプリ"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.6
  # 回線の種別（docs/DOWNLOAD-DESIGN.md 4.6・論点 11b）。
  #
  # ダウンロードの既定を「Wi-Fi のときだけ」にするために要る。
  # **これは「従量課金を避けられる保証」ではない**——返るのは
  # どの種類の回線に繋がっているかであって、その回線が従量制かどうかでは
  # ない（テザリングは Wi-Fi に見える）。画面の文言もそう書くこと。
  #
  # **Android には `ACCESS_NETWORK_STATE` が要る。**
  # `android/app/src/main/AndroidManifest.xml` は別の担当の持ち物なので、
  # ここでは足していない（4.6）。
  connectivity_plus: ^7.0.0
  # Flutter が「その環境らしい見た目」に切り替える部品（戻る矢印など）が
  # CupertinoIcons を参照する。Mac や iPhone のブラウザで開いたときに
  # これが無いとアイコンが豆腐（□）になるため入れている。
  # 使われる字形だけが残るので、ビルド後の大きさはほとんど増えない。
  cupertino_icons: ^1.0.8
  # Sign in with Apple の nonce をハッシュするために要る
  # （docs/MOBILE-APP-DESIGN.md 5-6）。
  #
  # **Apple には SHA-256 したもの、Firebase には生のものを渡す。**
  # 取り違えると Firebase が検証に失敗して `invalid-credential` になる。
  # 規則は lib/domain/apple_sign_in.dart に置き、
  # test/domain/apple_sign_in_test.dart が本物を見る。
  #
  # もともと firebase_auth の推移依存として入っていたものを、
  # 直接使うので直接依存に上げる（path_provider と同じ扱い）。
  crypto: ^3.0.7
  file_picker: ^11.0.3
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  firebase_storage: ^13.4.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: 17.4.0
  # アプリ内バナー広告（docs/PREMIUM-DESIGN.md の広告）。
  #
  # **import してよいのは lib/ui/widgets/ad_banner_box_mobile.dart の1か所だけ。**
  # このパッケージの Dart は `dart:io` を使うので、Web ビルドに含めると
  # コンパイルが通らない（条件つき import で Web は stub を選ぶ）。
  # 設定・表示判定は lib/config/ads.dart に集約し、
  # test/domain/ad_banner_test.dart が「import は1か所」「広告要求は
  # 非パーソナライズ1か所」「ネイティブと Dart の ID 一致」を見張る。
  google_mobile_ads: ^9.1.0
  # モバイルでの Google ログイン（docs/MOBILE-APP-DESIGN.md 5-5）。
  #
  # **`signInWithPopup` は Web 専用**なので、ネイティブでは
  # このパッケージで資格情報だけ取り、`signInWithCredential` へ渡す。
  #
  # **v7 系にすること。v6 と v7 で API が完全に別物**
  # （v6 は `GoogleSignIn().signIn()`、v7 は
  # `GoogleSignIn.instance` / `initialize()` / `authenticate()`）。
  # ネットで見つかる記事はほぼ v6 なので、版を落とすと丸ごと動かない。
  google_sign_in: ^7.2.0
  # flutter_localizations が固定するバージョンに合わせる
  intl: ^0.20.2
  just_audio: ^0.10.6
  # 端末の保存先（docs/DOWNLOAD-DESIGN.md 3.1）。
  #
  # **もともと `just_audio` の推移依存として入っていただけ**なので、
  # 直接依存に上げる（1.3 の表）。使うのは
  # `getApplicationSupportDirectory()` **だけ**——
  # `getApplicationDocumentsDirectory()` は iOS で `UIFileSharingEnabled` を
  # 1 行足された瞬間にファイル App から丸見えになり、
  # `getTemporaryDirectory()` は OS が容量不足で勝手に消す（3.1）。
  # **どちらも使わないことを test/domain/download_storage_test.dart が見張る。**
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  # Sign in with Apple（docs/MOBILE-APP-DESIGN.md 5-6）。
  #
  # **iOS でだけ呼ぶ。** Web と Android で同じことをするには Apple 側に
  # Services ID と戻り先 URL の登録（ドメイン検証つき）が別途要る。
  # 出す・出さないの判定は lib/domain/apple_sign_in.dart の 1 箇所に閉じてある。
  sign_in_with_apple: ^8.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # **テストからログインの経路を差し替えるために要る**
  # （test/domain/mobile_sign_in_test.dart）。
  #
  # `GoogleSignInPlatform` / `SignInWithApplePlatform` は
  # 表向きのパッケージ（google_sign_in / sign_in_with_apple）が
  # **再公開していない**ので、こちらを直に取り込む。
  #
  # **本番には要らないので dev_dependencies に置く。**
  # ここへ差し替えを挿せるから、「キャンセルを失敗扱いにしない」も
  # 「Apple には SHA-256、Firebase には生の nonce」も、
  # 実機を出さずに本物の実装で確かめられる。
  google_sign_in_platform_interface: ^3.1.0
  mocktail: ^1.0.5
  sign_in_with_apple_platform_interface: ^2.0.0

  # アプリのランチャーアイコンを生成する（Android の mipmap / adaptive と
  # iOS の AppIcon）。**本番アプリには要らない生成ツールなので dev_dependencies。**
  # 元画像はブランドアイコン（web/brand）。生成した成果物（res/mipmap-* と
  # ios の AppIcon.appiconset）はコミットする。設定は末尾の flutter_launcher_icons。
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true

  # 日本語フォントを同梱する。**ただし `fonts:` では宣言しない。**
  #
  # Flutter Web（CanvasKit）は、既定では日本語のグリフを実行時に
  # Google Fonts から取得する。社内ネットワークなどで fonts.gstatic.com が
  # 遮断されていると日本語が表示されないため、アプリに含めている。
  #
  # **`fonts:` に書くと、エンジンが起動時に読み終えるまで最初の描画が
  # 始まらない。** 2026-08-08 の実測で、初回に取りに行く量のうち
  # 半分近くがこのフォントだった（w400 と w700 で約 2.5MB／圧縮後）。
  # 画面が出るまで 5 秒ほどかかる、という指摘の主因。
  #
  # そこで **`assets:` として積み、最初の描画のあとに読み込む**
  # （lib/providers/font_provider.dart）。読み終わるまでは端末の
  # 日本語フォントで描かれ、読み終わると差し替わる。
  # **文字が出ないことはない**（字を絞る手とは違い、全グリフを持つ）。
  #
  # **太字（w700）は同梱しない。** 約 1.2MB（圧縮後）を減らせて、
  # 失うのは見た目だけ。CanvasKit が w400 から擬似的な太字を作る。
  # 日本語では線が太るだけで、字形は保たれる。
  # ブランドのロゴ（brand/README.md）。
  #
  # **SVG ではなく PNG を積む。** SVG を描くには依存を 1 つ増やすことに
  # なり、足した部品が組み込まれないまま配信される事故を過去に起こして
  # いる（just_audio／docs/DEVLOG.md）。ロゴは大きさが決まっているので、
  # 解像度別の PNG で足りる。
  #
  # `2.0x/` は Flutter の決まりで、画面の細かい端末で自動的に選ばれる。
  # 一覧に書くのは 1x のパスだけでよい。
  assets:
    - assets/fonts/NotoSansJP-400.ttf
    - assets/brand/logo-vertical-light.png
    - assets/brand/logo-vertical-dark.png
    - assets/brand/logo-inline-light.png
    - assets/brand/logo-inline-dark-notile.png

# アプリのランチャーアイコン生成の設定（dart run flutter_launcher_icons で実行）。
# 元画像はブランドアイコン（web/brand）。iOS 用に icon.svg から起こした 1024、
# Android の adaptive 前景は maskable（セーフゾーン設計）、背景はブランドの
# ネイビー。生成物（res/mipmap-* と AppIcon.appiconset）はコミットする。
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "web/brand/png/icon-1024.png"
  remove_alpha_ios: true
  background_color_ios: "#071426"
  adaptive_icon_background: "#0F3560"
  adaptive_icon_foreground: "web/brand/png/icon-maskable-512.png"
  min_sdk_android: 24
