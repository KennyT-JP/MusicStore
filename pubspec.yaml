name: music_list_app
description: "音源創庫（Track Cabinet） — メンバーが録音した音源や YouTube 等の URL を持ち寄って共有するアプリ"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.6
  # 回線の種別（docs/DOWNLOAD-DESIGN.md 4.6・論点 11b）。
  #
  # ダウンロードの既定を「Wi-Fi のときだけ」にするために要る。
  # **これは「従量課金を避けられる保証」ではない**——返るのは
  # どの種類の回線に繋がっているかであって、その回線が従量制かどうかでは
  # ない（テザリングは Wi-Fi に見える）。画面の文言もそう書くこと。
  #
  # **Android には `ACCESS_NETWORK_STATE` が要る。**
  # `android/app/src/main/AndroidManifest.xml` は別の担当の持ち物なので、
  # ここでは足していない（4.6）。
  connectivity_plus: ^7.0.0
  # Flutter が「その環境らしい見た目」に切り替える部品（戻る矢印など）が
  # CupertinoIcons を参照する。Mac や iPhone のブラウザで開いたときに
  # これが無いとアイコンが豆腐（□）になるため入れている。
  # 使われる字形だけが残るので、ビルド後の大きさはほとんど増えない。
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.3
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  firebase_storage: ^13.4.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: 17.4.0
  # flutter_localizations が固定するバージョンに合わせる
  intl: ^0.20.2
  just_audio: ^0.10.6
  # 端末の保存先（docs/DOWNLOAD-DESIGN.md 3.1）。
  #
  # **もともと `just_audio` の推移依存として入っていただけ**なので、
  # 直接依存に上げる（1.3 の表）。使うのは
  # `getApplicationSupportDirectory()` **だけ**——
  # `getApplicationDocumentsDirectory()` は iOS で `UIFileSharingEnabled` を
  # 1 行足された瞬間にファイル App から丸見えになり、
  # `getTemporaryDirectory()` は OS が容量不足で勝手に消す（3.1）。
  # **どちらも使わないことを test/domain/download_storage_test.dart が見張る。**
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  # 日本語フォントを同梱する。**ただし `fonts:` では宣言しない。**
  #
  # Flutter Web（CanvasKit）は、既定では日本語のグリフを実行時に
  # Google Fonts から取得する。社内ネットワークなどで fonts.gstatic.com が
  # 遮断されていると日本語が表示されないため、アプリに含めている。
  #
  # **`fonts:` に書くと、エンジンが起動時に読み終えるまで最初の描画が
  # 始まらない。** 2026-08-08 の実測で、初回に取りに行く量のうち
  # 半分近くがこのフォントだった（w400 と w700 で約 2.5MB／圧縮後）。
  # 画面が出るまで 5 秒ほどかかる、という指摘の主因。
  #
  # そこで **`assets:` として積み、最初の描画のあとに読み込む**
  # （lib/providers/font_provider.dart）。読み終わるまでは端末の
  # 日本語フォントで描かれ、読み終わると差し替わる。
  # **文字が出ないことはない**（字を絞る手とは違い、全グリフを持つ）。
  #
  # **太字（w700）は同梱しない。** 約 1.2MB（圧縮後）を減らせて、
  # 失うのは見た目だけ。CanvasKit が w400 から擬似的な太字を作る。
  # 日本語では線が太るだけで、字形は保たれる。
  # ブランドのロゴ（brand/README.md）。
  #
  # **SVG ではなく PNG を積む。** SVG を描くには依存を 1 つ増やすことに
  # なり、足した部品が組み込まれないまま配信される事故を過去に起こして
  # いる（just_audio／docs/DEVLOG.md）。ロゴは大きさが決まっているので、
  # 解像度別の PNG で足りる。
  #
  # `2.0x/` は Flutter の決まりで、画面の細かい端末で自動的に選ばれる。
  # 一覧に書くのは 1x のパスだけでよい。
  assets:
    - assets/fonts/NotoSansJP-400.ttf
    - assets/brand/logo-vertical-light.png
    - assets/brand/logo-vertical-dark.png
    - assets/brand/logo-inline-light.png
    - assets/brand/logo-inline-dark-notile.png
