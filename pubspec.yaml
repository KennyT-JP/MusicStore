name: music_list_app
description: "音楽リスト共有アプリ — メンバーが録音した音源や YouTube 等の URL を 1 つのリストに集約して共有する"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.6
  file_picker: ^11.0.3
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  firebase_storage: ^13.4.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  # flutter_localizations が固定するバージョンに合わせる
  intl: ^0.20.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
