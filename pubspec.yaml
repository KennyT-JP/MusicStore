name: music_list_app
description: "音楽リスト共有アプリ — メンバーが録音した音源や YouTube 等の URL を 1 つのリストに集約して共有する"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.6
  file_picker: ^11.0.3
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  firebase_storage: ^13.4.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  # flutter_localizations が固定するバージョンに合わせる
  intl: ^0.20.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  # 日本語フォントを同梱する。
  #
  # Flutter Web（CanvasKit）は、既定では日本語のグリフを実行時に
  # Google Fonts から取得する。社内ネットワークなどで fonts.gstatic.com が
  # 遮断されていると日本語が表示されないため、アプリに含めている。
  #
  # Noto Sans JP の日本語サブセット（各 2.25MB）。
  # 初回のみダウンロードされ、以降は端末側にキャッシュされる
  # （firebase.json の Cache-Control と Service Worker による。docs/SETUP.md 参照）。
  #
  # 太字を減らして初回の読み込みを軽くしたい場合は、w700 の行を消せば
  # CanvasKit が w400 から擬似的な太字を作る（見た目は少し劣る）。
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-700.ttf
          weight: 700
