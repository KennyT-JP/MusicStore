# iOS のビルドと App Store Connect への送信（仕様書 MOBILE-APP-DESIGN.md 5-11）
#
# ## なぜクラウドか
#
# **Xcode は macOS でしか動かない。** 開発は Windows で行っているため、
# iOS のビルドと署名だけをクラウドの macOS に任せる。
#
# **Mac 実機は要らない。** 同じ作者の Session Concierge が、
# この方式で Windows だけから App Store まで出している（2026-08-14）。
# 署名チームの選択も証明書の発行も、Xcode の画面ではなく CLI で行う。
#
# ## Android はここに無い
#
# **意図的です。** Android は手元の Windows で
# `flutter build appbundle --release --flavor prod` を実行し、
# Play Console へ手で上げる。CI 化していないのは、
# **署名鍵を CI に渡さずに済ませる**ため。
#
# ## 動かす前に必要なもの（依頼者の作業）
#
# **2026-08-16 に Codemagic の画面を実際に見て確かめた。** この口座は
# **Personal Account** なので、**Teams というメニューは無い**（Session Concierge の
# 手順書は「Teams → Integrations」と書いているが、それは同じ場所を指している。
# URL も `/teams/<id>` で、Personal Account が内部的に team として扱われている）。
#
# | 要るもの | 場所 | 状態 |
# | --- | --- | --- |
# | App Store Connect の API キー | Settings → Integrations → **Developer Portal** | **登録済み**（`SessionConcierge`・Key: CHFAV8VT47） |
# | App ID（capability は**下の 2 つとも**） | developer.apple.com → Identifiers | **作成済み**（`M8FUYFN8VG`） |
# | App Store Connect のアプリレコード | App Store Connect → マイ App | **作成済み**（ipa が上がっているので存在する） |
# | `CERTIFICATE_PRIVATE_KEY` | **このアプリの設定**の環境変数（グループ `appstore`） | **登録済み。ただし RSA 2048 であること**（下記） |
#
# **変数はアカウント全体ではなく、アプリごとに置く。** Codemagic の画面に
# 「Global variables and secrets will be removed from personal accounts in the
# future. Add your variables in app settings」と出ており、実際に
# アカウント側は「No existing variables」だった。
#
# ## App ID の capability は 2 つ要る（2026-08-16 の実測）
#
#   - Sign in with Apple
#   - Associated Domains
#
# **アプリ側の entitlements（ios/Runner/Runner.entitlements）に書いたものは、
# App ID 側にも同じだけ要る。** 片方だけだと archive がこう言って止まる。
#
#   "Runner" requires a provisioning profile with the Associated Domains and
#   Sign In with Apple features.
#
# **ただし、このエラーを「capability 不足」と読むと外す。**
# 2026-08-16 は capability を揃えても直らず、真因は
# **プロファイルが 1 件も無かったこと**（＝下の署名ステップが失敗していた）
# だった。**「無い」と言われたら、まず対象を数える。**
# 経緯は docs/DEVLOG.md 2026-08-16（5）。
#
# ## 秘密鍵は RSA 2048 でなければならない（2026-08-16 の実測）
#
#   openssl genrsa -out cert_key 2048
#
# **Apple は配布用証明書の作成に RSA 2048 しか受け付けない。**
# 別の種類だと証明書が作れず、プロファイルも作れない。
# **同じ鍵を使い続ければ、Apple 側の既存の証明書を再利用でき、
# 配布用証明書の保有枠も消費しない。**

workflows:
  ios-release:
    name: iOS リリース（App Store Connect へ送る）
    # M シリーズのインスタンス。Flutter の iOS ビルドはここが一番速い。
    instance_type: mac_mini_m2
    # Session Concierge の初回成功は 8 分 28 秒だった。
    # 60 分あれば、初回に依存の取得から走っても足りる。
    max_build_duration: 60

    integrations:
      # **Codemagic の画面で付けた登録名と一字一句同じにすること。**
      # 違うと「integration not found」でビルドが始まらない。
      #
      # **名前が `SessionConcierge` なのは誤りではない。**
      # App Store Connect の API キーは **Apple のアカウントに紐づく**もので、
      # アプリごとではない。Session Concierge を出したときに登録した
      # キー（Codemagic の Settings → Integrations → Developer Portal、
      # Key: CHFAV8VT47）が、そのまま音源創庫でも使える。
      #
      # **わざわざ別のキーを作らない。** Apple は API キーの本数に上限があり、
      # 増やすほど「どれがどれか」が分からなくなる。
      # 名前はキーの識別子であって、アプリ名ではない。
      app_store_connect: SessionConcierge

    environment:
      groups:
        # CERTIFICATE_PRIVATE_KEY が入っているグループ。
        - appstore
      vars:
        # 秘密ではない（アプリのバイナリにも入る値）。
        BUNDLE_ID: jp.sessionconcierge.trackcabinet
      # **版を固定する。** `stable` にすると、Codemagic 側が新しい版に
      # 上がった日から、こちらが何も変えていないのにビルドの中身が変わる。
      # ここは**手元で 1,318 件の検証を通した版**（2026-08-16）。
      # 上げるときは、先に手元で上げて全部通してから合わせること。
      #
      # **Xcode は固定しない。** Apple は「この版以降の SDK で
      # ビルドしたもの」しか受け付けず、**その下限が定期的に上がる**。
      # 固定すると、ある日突然アップロードを拒否される。
      flutter: 3.44.9
      xcode: latest
      cocoapods: default

      # **注意: environment.ios_signing はここに書かない。**
      #
      # あれは「Apple 側にある署名ファイルを取ってくる」設定で、
      # **無いものを作りはしない。** まだ 1 つも証明書を作っていない
      # 段階で使うと、次のエラーで止まる。
      #
      #   No matching profiles found for bundle identifier ... "app_store"
      #
      # 下の「署名ファイルを用意する」で --create を使って作らせる。

    scripts:
      - name: 依存を取得する
        script: flutter pub get

      - name: 自動テストを流す
        # **ビルドの前に流す。**
        # 送信してから気づくと、版番号を上げ直して出し直すことになる
        # （App Store は同じ番号を受け取らない）。
        script: flutter test

      - name: 署名ファイルを用意する
        script: |
          keychain initialize
          # --create で、証明書とプロビジョニングプロファイルを
          # **その場で Apple 側に作らせる。**
          #
          # **--certificate-key を絶対に省かないこと。**
          # 秘密鍵を渡さないと証明書を作れないが、
          # **ログに 1 行出すだけで、このステップは成功扱いで終わる。**
          #
          #   Cannot save Signing Certificates without certificate private key
          #
          # **渡してあっても、鍵が RSA 2048 でなければ同じことが起きる。**
          # 2026-08-16 に実際に踏んだ（docs/DEVLOG.md 2026-08-16（5））。
          #
          #   POST https://api.appstoreconnect.apple.com/v1/certificates returned 409:
          #     CSR algorithm/size incorrect. Expected: RSA(2048)
          #
          # 成功しているときは、出力末尾の 3 行
          # （Provisioning Profiles / Signing Certificate / Team Id）が埋まる。
          # **空だったら失敗している。**（共有ドキュメント AP-71）
          #
          # **原因を先に当てにいかないこと。** 同じ「緑・3 行が空」に至る道が
          # 少なくとも 2 本ある（指定漏れ／鍵の種類違い）。**見るのは 3 行。**
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          # Xcode の画面で署名チームを選ぶ操作に相当する。
          xcode-project use-profiles

      - name: ipa を作る
        script: |
          # **2 段に分ける。**
          # flutter build ipa は署名まで自分でやろうとし、その前段で
          # **開発用**証明書が鍵束にあるかを確かめる。
          # 配布用ビルドに開発用証明書は要らないのに落ちるので、
          # 署名しないビルドと ipa 化を分ける。
          flutter build ios --release --no-codesign
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # **どちらも false のまま。**
        #
        # submit_to_testflight: true は「**外部テスト**への提出」を意味し、
        # フィードバック用メール・審査連絡先・Apple のベータ審査が要る。
        # 未登録だと**ビルドの処理が終わった後**に落ちる（バイナリは無事）。
        #
        # **false でも TestFlight にビルドは出る。**
        # 内部テスター（チームのメンバー・最大 100 人）はそのまま入れる。
        # 審査が要るのは外部テスターへ配るときだけ。
        submit_to_testflight: false
        submit_to_app_store: false

      email:
        recipients:
          # **ビルドは非同期なので、画面を見ていないと落ちたことに気づかない。**
          - support@session-concierge.jp
        notify:
          success: true
          failure: true
