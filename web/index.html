<!DOCTYPE html>
<html lang="ja">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="録音した音源や見つけた楽曲を、1 つのリストに集めて共有するアプリです。">
  <meta name="theme-color" content="#0B2044">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="音源創庫">
  <link rel="apple-touch-icon" sizes="180x180" href="brand/png/apple-touch-icon.png">

  <!-- Favicon（brand/README.md の指定どおり）
       **SVG を先に書く。** 対応しているブラウザはこちらを使い、
       どの大きさでもぼやけない。対応していないものは png へ落ちる。
       16〜64px では簡略版（favicon.svg）を使う決まりになっている。 -->
  <link rel="icon" type="image/svg+xml" href="brand/favicon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="brand/png/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="brand/png/favicon-16.png"/>

  <!-- 共有したときに出る画像（OGP）。**絶対 URL で指すこと。**
       相対のままだと、読み取る側が解決できずに画像が出ない。 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="音源創庫 | TRACK CABINET">
  <meta property="og:description" content="みんなで音源をアップして、共有する。">
  <meta property="og:image" content="https://music-storage-d79b2.web.app/brand/png/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <title>音源創庫</title>
  <link rel="manifest" href="manifest.json">

  <!--
    **表示までの待ち時間を縮めるための指定。**

    Flutter Web は「index.html を読む → flutter_bootstrap.js →
    main.dart.js → 描画に必要なものを取りに行く」と、順番に辿って
    初めて必要なファイルが分かる作りになっている。**先に分かっている分は
    先に取りに行かせる。**

    - main.dart.js（圧縮後およそ 0.85MB）はどの画面でも必ず要る
    - 描画部（CanvasKit、圧縮後およそ 2.2MB）は Google の配信網から取る。
      接続の確立だけでも往復が要るので、先に済ませておく

    **Firebase の JS SDK も、最初の描画の前に必ず要る（2026-08-08）。**

    lib/main.dart は `await Firebase.initializeApp()` を終えてから
    `runApp` する。firebase_core は初期化のときに、使っている機能ぶんの
    SDK を <script> で読み込む。**つまり、この 5 本が揃うまで
    アプリは 1 フレームも描かない。**

    ところがこの読み込みは、main.dart.js を実行して初めて始まる。
    実測すると、エンジンとフォントを読み終えたあとに 2 波（app.js →
    残り 4 本）が直列でぶら下がっていた。**先に取りに行かせて、
    エンジンの読み込みと並べる。**

    **`modulepreload` を使う。`preload` + `as="script"` ではない。**
    firebase_core は SDK を動的な `import()` で読み込む
    （firebase_core_web の `injectSrcScript`）。`import()` が取りに行くのは
    **モジュール**で、`as="script"`（クラシックスクリプト）とは種類が違う。
    種類が合っていないと**先読みした分が使われず、同じものをもう一度
    取りに行く。** 速くするつもりが、転送量を倍にしていた。

    ブラウザは使われなかった先読みを警告で知らせる（2026-08-09、
    依頼者の開発者ツールで 5 件。ちょうど下の 5 本ぶん）。
    **先読みを足したら、開発者ツールで警告が出ていないか必ず見ること。**

    版を上げると URL が変わる。`test/domain/web_startup_test.dart` が
    firebase_core_web の持っている版と突き合わせるので、ずれたら落ちる。
  -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore-pipelines.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.17.0/firebase-functions.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js" crossorigin>

  <style>
    /*
      **読み込み中に白い画面を出さない。**

      Flutter は必要なものを取り終えるまで何も描かない。この間、既定では
      真っ白なページのままになり、止まっているのか読み込み中なのかが
      分からない。ここは HTML と CSS だけで作ってあるので、
      **アプリの読み込みを 1 バイトも待たずに出る。**

      消すのは Flutter が最初の描画を終えたとき（下の flutter-first-frame）。
    */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F8F9FF;               /* 明るい配色の surface に合わせる */
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      /* ブランドの Deep Navy（brand/README.md）。読み込み中から
         暗背景用のロゴと地続きに見えるようにする。 */
      html, body { background: #071426; }
    }

    /* 読み込み中に出すロゴ。**アプリの読み込みを待たない。**
       画面の明暗で差し替える（明背景には -light、暗背景には -dark）。 */
    #loading .logo { width: 200px; max-width: 60vw; height: auto; }
    #loading .logo.dark { display: none; }

    @media (prefers-color-scheme: dark) {
      #loading .logo.light { display: none; }
      #loading .logo.dark { display: block; }
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      /* 読み込みが一瞬で終わるときに、ちらつかせない。 */
      animation: fade-in 0.2s ease-out 0.3s both;
    }

    @keyframes fade-in { from { opacity: 0 } to { opacity: 1 } }

    #loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(27, 94, 158, 0.25);
      border-top-color: #1B5E9E;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg) } }

    #loading .label {
      color: #43474E;
      font-size: 14px;
      letter-spacing: 0.02em;
    }

    @media (prefers-color-scheme: dark) {
      #loading .spinner { border-color: rgba(164, 202, 255, 0.25); border-top-color: #A4CAFF; }
      #loading .label { color: #C3C6CF; }
    }

    /* 動きを控える設定の端末では回さない。 */
    @media (prefers-reduced-motion: reduce) {
      #loading .spinner { animation: none; }
      #loading { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <img class="logo light" src="brand/logo-horizontal-light.svg" alt="音源創庫" width="300" height="128">
    <img class="logo dark" src="brand/logo-horizontal-dark.svg" alt="音源創庫" width="300" height="128">
    <div class="spinner"></div>
    <div class="label">読み込んでいます…</div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter が最初の描画を終えたら、読み込み中の表示を消す。
    // このイベントは Flutter 側が発火する。
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
</body>
</html>
