<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="音源創庫">
  <!-- 16〜64px 用の簡略版。外側の淡いリングを省き、コアとグリフを大きく、
       線を太くして小サイズでの潰れを防ぐ。 -->
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2044"/>
      <stop offset="1" stop-color="#12557F"/>
    </linearGradient>
    <linearGradient id="fring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A5F3FC"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="fcore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#fbg)"/>

  <g fill="none" stroke="url(#fring)" stroke-linecap="round" stroke-width="36">
    <path d="M328 170.2 A112 112 0 0 1 328 341.8"/>
    <path d="M184 170.2 A112 112 0 0 0 184 341.8"/>
  </g>

  <circle cx="256" cy="256" r="80" fill="url(#fcore)"/>
  <g fill="none" stroke="#0B2648" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <path d="M217 278 V303 H295 V278"/>
  </g>
  <g fill="#0B2648">
    <path d="M256 201 L297 253 H215 Z"/>
    <rect x="243" y="253" width="25" height="33" rx="6"/>
  </g>
</svg>
