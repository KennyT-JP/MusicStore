<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="音源創庫 単色シンボル">
  <!-- 単色・背景透明。fill/stroke は currentColor なので CSS の color で着色できる。
       印刷・刻印・1色運用・グレースケール用。 -->
  <g color="#0B2648">
    <g fill="none" stroke="currentColor" stroke-linecap="round">
      <path d="M307.7 189.8 A84 84 0 0 1 307.7 322.2"   stroke-width="22"/>
      <path d="M204.3 189.8 A84 84 0 0 0 204.3 322.2"   stroke-width="22"/>
      <path d="M337.3 152.0 A132 132 0 0 1 337.3 360.0" stroke-width="19" opacity=".7"/>
      <path d="M174.7 152.0 A132 132 0 0 0 174.7 360.0" stroke-width="19" opacity=".7"/>
      <path d="M366.8 114.2 A180 180 0 0 1 366.8 397.8" stroke-width="16" opacity=".4"/>
      <path d="M145.2 114.2 A180 180 0 0 0 145.2 397.8" stroke-width="16" opacity=".4"/>
    </g>
    <!-- コア円からアップロード記号を型抜き(evenodd) -->
    <path fill="currentColor" fill-rule="evenodd"
          d="M198 256 A58 58 0 1 1 314 256 A58 58 0 1 1 198 256 Z
             M222 272 H234 V284 H278 V272 H290 V296 H222 Z
             M256 216 L286 254 H226 Z
             M247 254 H265 V278 H247 Z"/>
  </g>
</svg>
