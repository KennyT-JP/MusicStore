<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 128" width="300" height="128" role="img" aria-label="音源創庫 Track Cabinet">
  <!-- 明るい背景に置く横組みロゴ -->
  <defs>
    <linearGradient id="lhl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/><stop offset=".6" stop-color="#0F3560"/><stop offset="1" stop-color="#12557F"/>
    </linearGradient>
    <linearGradient id="lhl-ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A5F3FC"/><stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="lhl-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
  </defs>

  <g transform="translate(12 24) scale(0.15625)">
