<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="音源創庫 Track Cabinet — みんなで音源をアップして、共有する。">
  <!-- OGP / Twitter Card 用 1200x630 -->
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050F1E"/><stop offset=".55" stop-color="#0E2F55"/><stop offset="1" stop-color="#11507A"/>
    </linearGradient>
    <linearGradient id="og-ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A5F3FC"/><stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="og-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="og-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".30"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <circle cx="600" cy="250" r="440" fill="url(#og-glow)"/>

  <!-- 背景装飾: 大きく薄い共鳴の輪 -->
  <g fill="none" stroke="#7DD3FC" stroke-linecap="round" opacity=".10">
    <path d="M887.6 87.6 A420 420 0 0 1 887.6 748.4" stroke-width="26"/>
    <path d="M312.4 87.6 A420 420 0 0 0 312.4 748.4" stroke-width="26"/>
    <path d="M958.1 -10.6 A540 540 0 0 1 958.1 846.6" stroke-width="22"/>
    <path d="M241.9 -10.6 A540 540 0 0 0 241.9 846.6" stroke-width="22"/>
  </g>

  <g transform="translate(525 118) scale(0.29297)">
    <rect width="512" height="512" rx="116" fill="#0B2044"/>
    <g fill="none" stroke="url(#og-ring)" stroke-linecap="round">
      <path d="M307.7 189.8 A84 84 0 0 1 307.7 322.2"   stroke-width="22"/>
      <path d="M204.3 189.8 A84 84 0 0 0 204.3 322.2"   stroke-width="22"/>
      <path d="M337.3 152.0 A132 132 0 0 1 337.3 360.0" stroke-width="19" opacity=".72"/>
      <path d="M174.7 152.0 A132 132 0 0 0 174.7 360.0" stroke-width="19" opacity=".72"/>
      <path d="M366.8 114.2 A180 180 0 0 1 366.8 397.8" stroke-width="16" opacity=".42"/>
      <path d="M145.2 114.2 A180 180 0 0 0 145.2 397.8" stroke-width="16" opacity=".42"/>
    </g>
    <circle cx="256" cy="256" r="58" fill="url(#og-core)"/>
    <g fill="none" stroke="#0B2648" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M228 272 V290 H284 V272"/>
    </g>
    <g fill="#0B2648">
      <path d="M256 216 L286 254 H226 Z"/>
      <rect x="247" y="254" width="18" height="24" rx="4"/>
    </g>
  </g>

  <g font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif" text-anchor="middle">
    <text x="604" y="400" font-size="78" font-weight="700" letter-spacing="16" fill="#EAF6FF">音源創庫</text>
    <text x="602" y="446" font-size="20" font-weight="600" letter-spacing="9" fill="#5EE0F7">TRACK CABINET</text>
    <text x="600" y="522" font-size="25" font-weight="500" letter-spacing="2" fill="#9FC2E4">みんなで音源をアップして、共有する。</text>
  </g>
</svg>
